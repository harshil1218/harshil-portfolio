<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- one mark for every tab: the whole Branch in the brand gradient reads on light, coloured and dark tab bars -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="4" y1="60" x2="60" y2="4">
      <stop offset="0" stop-color="#0B27F0"/>
      <stop offset="1" stop-color="#00A9F0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5">
    <path d="M20 12 V52"/>
    <path d="M20 28 C20 37 44 33 44 43 V52"/>
  </g>
  <g fill="url(#g)">
    <circle cx="20" cy="12" r="5.5"/>
    <circle cx="20" cy="52" r="5.5"/>
    <circle cx="44" cy="52" r="5.5"/>
  </g>
</svg>
